    <script>
        var vot=3.6
        var starts =document.querySelectorAll(".star svg")
        for (let index = 0; index < Math.floor(vot) ; index++) {
            starts[index].setAttribute("fill","yellow")
        }
        if (vot-Math.floor(vot)>0) {
            let lastStar=starts[Math.trunc(vot)]
            let perc=(vot-Math.trunc(vot))*100
            console.log(perc)
            console.log(lastStar)
            lastStar.querySelector(".startStar").setAttribute("stop-color","yellow")
            lastStar.querySelector(".startStar").setAttribute("offset",perc+"%")
            lastStar.querySelector(".endStar").setAttribute("offset",perc+"%")
            lastStar.setAttribute("fill","url(#star"+Array.from(starts).indexOf(lastStar)+")")
        }
        document.getElementById("valutazione").textContent=vot
        </script>
