<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>
		jobsMatcher
	</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	</link>
	<link rel="stylesheet" href="./CSS/reg.css">
	</link>
	<link rel="stylesheet" href="./CSS/footer.css">
	</link>
	<link rel="stylesheet" href="./CSS/navUser.css">
	</link>
</head>
<body>
	<div id="302" class="main min-vh-100 d-flex flex-column">
		<nav id="303" class="bg-body-tertiary navbar">
			<div id="304" class="row align-items-center container-fluid text-center">
				<div id="305" class="ms-4d5 col-12 d-flex align-items-center  text-start">
					<a id="306" class="showInfo" onclick="show('userInfo')">
						<svg id="307" class="bi bi-list" xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 16 16">
							<path id="308" fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5">
							</path>
						</svg>
					</a>
					<span id="309" class="d-flex align-items-center col-12">
						<a id="310" class="ms-3 fs-3" href="/homePage" style="text-decoration: none;">
							JOBSMATCHER
						</a>
						<a id="311" class="ms-3 fs-5 d-none d-sm-block" href="/offer" style="text-decoration: none;">
							Offerte
						</a>
					</span>
				</div>
				<div id="312" class="row">
					<div id="userInfo" class="userInfo ms-4d5 col-2 text-start" style="display:none;">
						<ul id="314">
							<li id="315">
								<a id="316" href="/profile">
									Profilo
								</a>
							</li>
							<li id="317">
								<a id="318" href="/">
									Preferiti
								</a>
							</li>
							<li id="319">
								<a id="320" href="/logout">
									Logout
								</a>
							</li>
						</ul>
					</div>
				</div>
			</div>
		</nav>
		<div id="321" class="d-sm-flex flex-fill mt-4 mb-4">
			<div id="322" class="col-12 d-sm-none">
				<a id="323" class="btn btn-light w-100" data-bs-toggle="collapse" href="#filtro" role="button" aria-expanded="false" aria-controls="filtro">
					<svg id="324" class="bi bi-list" xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 16 16">
						<patgh id="325" fill-rule="evenodd" d="M6 10.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5m-2-3a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5m-2-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5">
						</patgh>
					</svg>
				</a>
			</div>
			<div id="filtro" class="left d-sm-block col-12 col-sm-4 fs-6 collapse">
				<div id="327" class="card col-12 col-sm-8 float-end">
					<div id="328" class="card-body">
						<div id="329" class="date">
							<h6 id="330">
								pubblicato:
							</h6>
							<div id="331" class="form-check">
								<input id="lastWeek" class="form-check-input" value="7" type="radio" name="date"/>
								<label id="333" class="form-check-label" for="lastWeek">
									Ultima settimana
								</label>
							</div>
							<div id="334" class="form-check">
								<input id="penulWeek" class="form-check-input" value="14" type="radio" name="date"/>
								<label id="336" class="form-check-label" for="penulWeek">
									2 settimane fa
								</label>
							</div>
						</div>
						<div id="337" class="parola-chiave row">
							<h6 id="338">
								search
							</h6>
							<input id="339" class="col-12 col-lg" name="keyword" type="text" placeholder="Search"/>
						</div>
						<div id="340" class="stipendio mt-q">
							<h6 id="341">
								Stipendio minimo
							</h6>
							<input id="stipendio-minimo" class="form-range" type="range" name="stipendioMin" value="0" min="0" max="10000"/>
							<input id="stipendio-minimo-value" class="col-8 col-lg-3" type="number" step="1" value="0"/>
						</div>
					</div>
				</div>
			</div>
			<div id="center" class="center d-flex flex-column  col-12 col-sm-4 ms-sm-3">
				<div id="jobs" class="jobs">
				</div>
				<div id="346" class="d-flex flex-fill justify-content-center align-items-end mb-5" aria-label="Page navigation">
					<ul id="347" class="pagination">
						<li id="prev">
							<a id="349" class="page-link" href="#">
								&lt
							</a>
						</li>
						<li id="next">
							<a id="351" class="page-link" href="#">
								&gt
							</a>
						</li>
					</ul>
				</div>
			</div>
			<div id="352" class="right col-12 ms-sm-3 col-sm-3">
				<div id="353" class="card">
					<div id="354" class="card-body">
						<button id="355" class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#modal">
							PUBBLICA
						</button>
					</div>
				</div>
			</div>
		</div>
		<footer id="73" class="footer bg-light py-3">
			<div id="74" class="container text-center" style="font-size: small;">
				<div id="75" class="row">
					<div id="359" class="col-md-4 mb-2">
						<a id="76" class="text-decoration-none text-dark me-3" href="#">
							Informazioni
						</a>
						<a id="77" class="text-decoration-none text-dark me-3" href="#">
							Sito
						</a>
						<a id="78" class="text-decoration-none text-dark" href="#">
							Informativa sulla privacy
						</a>
					</div>
					<div id="363" class="col-md-4 mb-2">
						<p id="364" class="mb-0">
							&copy; 2023 JOBSMATCHER. Tutti i diritti riservati.
						</p>
					</div>
					<div id="365" class="col-md-4">
						<a id="366" class="text-decoration-none text-dark me-2" href="#">
							<i class='bi bi-facebook'></i>
						</a>
						<a id="367" class="text-decoration-none text-dark me-2" href="#">
							<i class='bi bi-twitter'></i>
						</a>
						<a id="368" class="text-decoration-none text-dark" href="#">
							<i class='bi bi-linkedin'></i>
						</a>
					</div>
				</div>
			</div>
		</footer>
		<div id="modal" class="modal" index="-1">
			<div id="370" class="modal-dialog">
				<div id="371" class="modal-content">
					<div id="372" class="modal-body">
						<form id="373" action="/offers" method="post">
							<div id="374" class="row mb-1">
								<input id="375" type="text" name="arg"/>
							</div>
							<div id="376" class="row">
								<button id="377" class="btn btn-primary" type="submit">
									submit
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script src="./js/RestUtil.js">
	</script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
	</script>
	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous">
	</script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.min.js" integrity="sha384-VQqxDN0EQCkWoxt/0vsQvZswzTHUVOImccYmSyhJTp7kGtPed0Qcx8rK9h9YEgx+" crossorigin="anonymous">
	</script>
	<script src="JS/show.js">
	</script>
	<script src="JS/offer.js">
	</script>
</body>
</html>
